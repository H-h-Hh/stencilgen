name: build

# Runs the parser tests, then builds a standalone folder for each OS.
# Tag a commit (git tag v1.1.0 && git push --tags) to get the artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cadquery-ocp numpy
      - name: Parser tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            strip_flag: ""
          - os: macos-latest
            name: macos-arm64
            strip_flag: ""
          - os: ubuntu-latest
            name: linux-x64
            # Linux OCP wheels ship unstripped .so files (~270 MB); strip them.
            strip_flag: "--strip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned: this trio is verified to produce a working bundle.
          # Unpinned runs shipped a bundle that died with
          # "Unregistered type : Bnd_Box::Limits".
          pip install "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.9" "cadquery-ocp==7.9.3.1.1"
          pip install numpy ezdxf

      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --console --name StencilGen
          ${{ matrix.strip_flag }}
          --collect-all OCP
          --exclude-module vtkmodules --exclude-module cadquery
          --exclude-module scipy --exclude-module numba --exclude-module llvmlite
          --exclude-module casadi --exclude-module matplotlib
          app.py

      - name: Report size
        shell: bash
        run: du -sh dist/StencilGen

      # The Linux wheels lay every shared object down twice: once in the
      # directory their RPATH points at (cadquery_ocp.libs/, vtkmodules/),
      # and again at the bundle root. The root copies are dead weight.
      - name: Trim duplicate libraries
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          cd dist/StencilGen/_internal
          du -sh .
          find . -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              twin=$(find . -mindepth 2 -type f -name "$base" -print -quit)
              if [ -n "$twin" ] && cmp -s "$f" "$twin"; then rm -f "$f"; fi
            done
          du -sh .

      - name: Smoke test
        shell: bash
        working-directory: dist/StencilGen
        run: |
          set -euo pipefail
          BIN=./StencilGen
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./StencilGen.exe; fi
          "$BIN" ../../tests/fixtures --fixture -o "$RUNNER_TEMP/smoke"
          ls -l "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/stencil_top.step"
          test -s "$RUNNER_TEMP/smoke/stencil_bottom.stl"
          test -s "$RUNNER_TEMP/smoke/fixture.stl"

      - uses: actions/upload-artifact@v4
        with:
          name: StencilGen-${{ matrix.name }}
          path: dist/StencilGen
          if-no-files-found: error
