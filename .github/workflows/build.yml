name: build

# Runs the parser tests, then builds a standalone folder for each OS.
# Tag a commit (git tag v1.1.0 && git push --tags) to get the artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cadquery-ocp numpy
      - name: Parser tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cadquery-ocp numpy ezdxf

      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --console --name StencilGen
          --collect-all OCP
          --exclude-module vtkmodules --exclude-module cadquery
          --exclude-module scipy --exclude-module numba --exclude-module llvmlite
          --exclude-module casadi --exclude-module matplotlib
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: StencilGen-${{ matrix.name }}
          path: dist/StencilGen
          if-no-files-found: error
