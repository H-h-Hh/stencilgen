[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stencilgen"
version = "1.1.0"
description = "Generate a solder-paste stencil 3D model and a matching fixture from Gerber exports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "H-h-Hh" }]
keywords = ["pcb", "stencil", "solder-paste", "gerber", "pcb-assembly", "cad", "opencascade"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: CAD",
]
dependencies = [
    "cadquery-ocp>=7.7,<8",
    "numpy>=1.24",
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.1"]
dragging = ["tkinterdnd2>=0.3"]

[project.urls]
Homepage = "https://github.com/H-h-Hh/stencilgen"

[project.scripts]
stencilgen = "stencilgen.cli:main"

[tool.setuptools]
packages = ["stencilgen"]
